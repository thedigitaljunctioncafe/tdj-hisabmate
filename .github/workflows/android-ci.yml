name: TDJ HisabMate Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Signing Keystore
        if: ${{ env.TDJ_KEYSTORE_BASE64 != '' }}
        env:
          TDJ_KEYSTORE_BASE64: ${{ secrets.TDJ_KEYSTORE_BASE64 }}
        run: |
          echo "$TDJ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build Release APK & Bundle
        env:
          TDJ_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TDJ_KEYSTORE_PASSWORD: ${{ secrets.TDJ_KEYSTORE_PASSWORD }}
          TDJ_KEY_ALIAS: ${{ secrets.TDJ_KEY_ALIAS }}
          TDJ_KEY_PASSWORD: ${{ secrets.TDJ_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Verify Release APK Signature
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.TDJ_KEYSTORE_BASE64 != '' }}
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Signed release APK was not generated at $RELEASE_APK!"
            exit 1
          fi

          # Locate apksigner in Android SDK build-tools
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi

          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          echo "Production APK signature verification successful!"

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tdj-hisabmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tdj-hisabmate-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
